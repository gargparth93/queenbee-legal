# Keeps the QueenBee Supabase backend awake. Free-tier projects pause after
# ~7 days without activity, and a paused project takes the app's verdicts down.
#
# The key below is the project's public anon key, the same one shipped inside
# the app. It cannot read or write any data (usage_events has RLS on and no
# anon grants); the request only registers activity.
#
# The job fails if the backend is unreachable (e.g. paused), so GitHub's
# failure email doubles as an outage alert.

name: Supabase keep-alive

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: https://jqdbffhvigwxxgrxlwog.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxZGJmZmh2aWd3eHhncnhsd29nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4ODc5NjUsImV4cCI6MjA5NzQ2Mzk2NX0.dhScgooDuAyKpnit7fIDNSyXUQH7MHl69pIjOdv1yDA
        run: |
          set -u
          auth=$(curl -s -m 30 -o /dev/null -w "%{http_code}" "$SUPABASE_URL/auth/v1/health" -H "apikey: $SUPABASE_ANON_KEY")
          rest=$(curl -s -m 30 -o /dev/null -w "%{http_code}" "$SUPABASE_URL/rest/v1/usage_events?select=id&limit=1" -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "auth/v1/health -> $auth"
          echo "rest/v1 (expected 401) -> $rest"
          if [ "$auth" != "200" ]; then
            echo "::error::Supabase backend unreachable or unhealthy (auth health $auth). Check whether the project is paused."
            exit 1
          fi
